# yaml-language-server: $schema=https://json.schemastore.org/github-workflow.json
name: CI

on:
  push:
    branches: [main, feat/rag-retriever-fix]
  pull_request:
    branches: [main]

jobs:
  test-and-eval:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: password
          POSTGRES_DB: civicos_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      qdrant:
        image: qdrant/qdrant:latest
        ports:
          - 6333:6333

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python3 -m pip install --upgrade pip
          if [ -f requirements.txt ]; then python3 -m pip install -r requirements.txt; fi
          python3 -m pip install pytest httpx pip-audit ruff

      - name: Run Unit and Integration Tests
        env:
          DATABASE_URL: postgresql://postgres:password@localhost:5432/civicos_test
          QDRANT_HOST: localhost
          QDRANT_PORT: 6333
          USE_MOCK_LLM: true
        run: python3 -m pytest tests --verbose

      - name: Security Scan
        run: python3 -m pip_audit || true

      - name: Lint with Ruff
        run: python3 -m ruff check . --output-format=github
