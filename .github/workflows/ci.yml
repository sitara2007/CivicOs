name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test-and-eval:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          # Fix: Sirf cross-platform dependencies install karo, Windows specific ignore karo
          Get-Content requirements.txt | Where-Object { $_ -notlike "*sys_platform*" } | Set-Content requirements_ci.txt
          pip install -r requirements_ci.txt
          pip install promptfoo pytest httpx safety ruff

      - name: Run Unit Tests
        run: pytest tests --verbose

      - name: Security Scan
        run: safety check -r requirements_ci.txt --full-report

      - name: Lint with Ruff
        run: ruff check . --output-format=github

      - name: Run AI Evaluations
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: |
          # --assert-fail-fast ka matlab hai ki ek bhi test fail hua toh pipeline red ho jayegi
          promptfoo eval -c tests/evaluation/promptfoo.yaml --assert-fail-fast