name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip' # Pro Tip: Cache lagane se pipeline 2x fast ho jayegi

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
          # Agar tum dev dependencies bhi install karna chahti ho:
          # pip install pytest 

      - name: Run tests
        run: pytest tests --verbose
      - name: Security Scan
        run: |
          pip install safety
          safety check -r requirements.txt
      - name: Lint with Ruff
        run: |
          pip install ruff
          ruff check .
      - name: Run AI Evaluations
        run: pytest tests/evaluation/ --eval-only