name: Pytest

on:
  push:
    branches:
      - '**'

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # 1. Setup caching taaki heavy libraries bar-bar download na hon
      - name: Cache dependencies
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('requirements.txt') }}

      # 2. Dependency installation without Windows-specific junk
      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt

      # 3. Test isolation (Xdist use karo parallel testing ke liye)
      - name: Run tests
        run: pytest -n auto --dist loadscope
