services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: govflow
      POSTGRES_USER: govflow
      POSTGRES_PASSWORD: devpassword
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U govflow -d govflow"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    mem_limit: 1g
    cpus: 0.5
    networks:
      backend:
        aliases:
          - postgres

  qdrant:
    image: qdrant/qdrant:latest
    ports:
      - "6333:6333"
    volumes:
      - qdrantdata:/qdrant/storage
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:6333/collections"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    mem_limit: 1g
    cpus: 0.5
    networks:
      backend:
        aliases:
          - qdrant

  redis:
    image: redis:7-alpine
    command: redis-server --appendonly yes
    ports:
      - "6379:6379"
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    mem_limit: 512m
    cpus: 0.25
    networks:
      backend:
        aliases:
          - redis

  api:
    build:
      context: .
      target: runtime
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000
    ports:
      - "8000:8000"
    env_file: .env
    depends_on:
      postgres:
        condition: service_healthy
      qdrant:
        condition: service_healthy
      redis:
        condition: service_healthy
    mem_limit: 1g
    cpus: 0.5
    networks:
      backend:
        aliases:
          - api

  worker:
    build:
      context: .
      target: runtime
    command: celery -A app.tasks.process_document worker --loglevel=INFO --queues=govflow
    env_file: .env
    depends_on:
      postgres:
        condition: service_healthy
      qdrant:
        condition: service_healthy
      redis:
        condition: service_healthy
    mem_limit: 1g
    cpus: 0.5
    networks:
      backend:
        aliases:
          - worker

  python-rag-service:
    build:
      context: ./python-rag-service
      dockerfile: Dockerfile
    command: uvicorn app:app --host 0.0.0.0 --port 8001
    ports:
      - "8001:8001"
    environment:
      PORT: "8001"
    networks:
      backend:
        aliases:
          - python-rag-service

networks:
  backend:
    driver: bridge

volumes:
  pgdata:
  qdrantdata:
  redisdata:
