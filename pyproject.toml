[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "civicos"
version = "0.1.0"
description = "RAG-based government document assistant API."
requires-python = ">=3.12"
dependencies = [
    "torch>=2.2.0",
    "asyncpg>=0.29",
    "celery>=5.4",
    "fastapi>=0.115",
    "openai>=1.0",
    "pydantic>=2.7",
    "pydantic-settings>=2.2",
    "pypdf>=4.0",
    "pybreaker>=1.0",
    "qdrant-client>=1.9",
    "sentence-transformers>=3.0",
    "sqlalchemy[asyncio]>=2.0",
    "tenacity>=8.2",
    "uvicorn[standard]>=0.30",
    "uuid6>=2024.1.12",
]

[project.optional-dependencies]
dev = [
    "httpx>=0.27",
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "ruff>=0.5.0",
]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.ruff]
line-length = 100  # Elite Engineers 100 prefer karte hain for modern AI/LLM code
target-version = "py312"

[tool.ruff.lint]
# E: Error, F: Pyflakes, I: Isort, UP: Upgrade, B: Bugbear, C90: Complexity
select = ["E", "F", "I", "UP", "B", "C90"]
ignore = []

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
